<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6eb5e0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>New Homes Visualisation</title>
  <meta name="description" content="Visualisation of Northern Ireland new-build developments." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="assets/style.css?v=20261125ab" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sheet-chrome">
        <div class="sheet-grab" id="sheet-grab" aria-hidden="true">
          <span class="sheet-handle"></span>
        </div>

        <header class="brand">
          <div class="brand-row">
            <div>
            <p class="eyebrow">Northern Ireland · new builds</p>
            <h1>New Homes Visualisation</h1>
            </div>
            <button type="button" class="sheet-close" id="sheet-close" aria-label="Close browse panel">Close</button>
          </div>
          <p class="lede">268 developments across Northern Ireland — explore by map, agent, or developer.</p>
        </header>

        <div class="stats" id="stats">
          <div class="stat"><span class="stat-value" id="stat-total">—</span><span class="stat-label">Developments</span></div>
          <div class="stat"><span class="stat-value" id="stat-homes">—</span><span class="stat-label">Homes available</span></div>
          <div class="stat"><span class="stat-value" id="stat-redundant">—</span><span class="stat-label">Redundant</span></div>
          <div class="stat"><span class="stat-value" id="stat-agents">—</span><span class="stat-label">Agents</span></div>
        </div>

        <div class="controls">
          <label class="field field-search">
            <span>Search</span>
            <input type="search" id="q" placeholder="Name, town, agent, developer…" autocomplete="off" enterkeyhint="search" />
          </label>
          <details class="filters-more">
            <summary>More filters</summary>
            <div class="filters-more-body">
              <label class="field">
                <span>Status</span>
                <select id="status">
                  <option value="">All statuses</option>
                </select>
              </label>
              <label class="check">
                <input type="checkbox" id="hide-redundant" />
                Hide sale agreed / redundant
              </label>
            </div>
          </details>
        </div>

        <nav class="mobile-tabs" role="tablist" aria-label="Browse">
          <button type="button" class="mobile-tab active" data-panel="list" role="tab" aria-selected="true">Developments</button>
          <button type="button" class="mobile-tab" data-panel="agents" role="tab" aria-selected="false">Agents</button>
          <button type="button" class="mobile-tab" data-panel="developers" role="tab" aria-selected="false">Developers</button>
        </nav>
      </div>

      <div class="panels" data-active-panel="list">
        <section class="panel panel-list" data-panel-pane="list">
          <h2 class="panel-title">Developments</h2>
          <div class="pane" id="pane-list"></div>
        </section>
        <section class="panel panel-orgs">
          <div class="org-col" data-panel-pane="agents">
            <h2 class="panel-title">Agents</h2>
            <div class="pane pane-tallies" id="pane-agents"></div>
          </div>
          <div class="org-col" data-panel-pane="developers">
            <h2 class="panel-title">Developers</h2>
            <div class="pane pane-tallies" id="pane-developers"></div>
          </div>
        </section>
      </div>

      <footer class="foot">
        <span id="meta"></span>
      </footer>
    </aside>

    <button type="button" class="sheet-backdrop" id="sheet-backdrop" aria-label="Dismiss browse panel" hidden></button>

    <main class="map-wrap">
      <div id="map" role="application" aria-label="Northern Ireland new developments map"></div>
      <div class="map-legend">
        <span><i class="dot live"></i> Available</span>
        <span><i class="dot dead"></i> Redundant / sale agreed</span>
        <span class="hint">OSNI counties</span>
      </div>
      <button type="button" class="browse-fab" id="browse-fab" aria-expanded="false" aria-controls="sidebar">
        Browse list
      </button>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="assets/app.js?v=20261125ab"></script>
</body>
</html>
